<fieldset>
  <label>
    Title
    <input
      name="title"
      placeholder="My Tierist"
      aria-invalid="{{ err_title and 'true' or '' }}"
      aria-labeled-by="{{ err_title and 'err_title' or '' }}"
      value="{{ tierlist and tierlist.title or '' }}"
      required
      />
    {% if err_title then %}
      <small id="err_title">{{ err_title }}</small>
    {% end %}
  </label>
</fieldset>
